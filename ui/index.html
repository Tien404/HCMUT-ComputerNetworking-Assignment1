<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collab</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Collab</h1>
    <p id="status" role="status">Status</p>
    <h2>Login</h2>
    <label>Username <input id="username" disabled /></label>
    <label>Password <input id="password" type="password" disabled /></label>
    <button disabled>Log in</button>
    <h2>Online users</h2>
    <ul id="users"></ul>
    <h2>Chat</h2>
    <label
      >Recipient
      <select id="recipient" disabled>
        <option>Everyone</option>
      </select></label
    >
    <ol id="messages"></ol>
    <label>Message <input id="message" disabled /></label>
    <button disabled>Send</button>
    <h2>File transfer</h2>
    <input id="file" type="file" aria-label="Choose file" disabled />
    <button disabled>Send file</button>
    <progress
      id="progress"
      value="0"
      max="100"
      aria-label="File transfer progress"
    ></progress>
    <script src="app.js"></script>
  </body>
</html>
