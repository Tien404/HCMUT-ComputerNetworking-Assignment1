<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Networking Collaboration Prototype</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Collaboration Prototype</h1>
    <p class="notice">UI mock-up — client connection and file transfer are not wired up yet.</p>
    <section>
      <h2>Messages</h2>
      <div id="messages" aria-live="polite">
        <p class="empty">Messages will appear here when the UI is connected to a client.</p>
      </div>
      <form id="message-form">
        <label for="message">Message</label>
        <input id="message" name="message" autocomplete="off" disabled>
        <button type="submit" disabled>Send</button>
      </form>
    </section>
    <section>
      <h2>Online users</h2>
      <p>Connect through the CLI client to test the current chat prototype.</p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
